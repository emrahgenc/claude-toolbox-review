name: test

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        python: ["3.9", "3.12"]
        # Python 3.9 is what macOS ships; GitHub's current Ubuntu image no longer offers it, so Linux uses 3.10.
        exclude:
          - os: ubuntu-latest
            python: "3.9"
        include:
          - os: ubuntu-latest
            python: "3.10"
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python }}
      - name: Compile every script
        run: python -c "import glob; [compile(open(p).read(), p, 'exec') for p in glob.glob('skills/review/scripts/*.py')]"
      - name: Unit and end-to-end tests
        run: python -m unittest discover -s tests -v
